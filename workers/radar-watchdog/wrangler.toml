# Cloudflare Worker:日报流水线的外部触发器 + 哨兵。
#
# 为什么不放在 GitHub 自己的 cron 里:GitHub Actions 的 schedule 触发时刻不受控。
# 本仓库实测 2026-08-27 三道 cron 全部漂到 4~5 小时之后,08-28 一道都没触发,
# 连着两天日报靠人工补跑。workflow_dispatch 是即时的,所以起跑的决定权放到外面。
#
# 也不放在本机 launchd 里:那条通道依赖 Mac 开机,出差/关机就断。

name = "ai-daily-radar-watchdog"
main = "src/index.js"
compatibility_date = "2026-08-01"

# 日志留存,出问题能在 CF 控制台回看(也可以 npx wrangler tail 实时看)
[observability]
enabled = true

[vars]
REPO = "nengzong/ai-daily-radar"
WORKFLOW = "daily-radar.yml"

# Cloudflare 的 cron 用 UTC。北京时间 = UTC + 8。
#   50 23 * * *  = 北京 07:50  起跑
#   40 0  * * *  = 北京 08:40  查岗
#
# 起跑时间【就是】送达时间减去生成耗时(实测 15~25 分钟),日报约 08:05~08:15 到。
# 早先起跑定在 06:00,靠 workflow 里一步 sleep 挂到 08:30 才投递——那 2.5 小时挂机
# 是按 GitHub Actions 的 runner 分钟计费的,一个月 4500 分钟,2026-08-30 把私有仓库
# 2000 分钟/月的免费额度烧穿,连着几天 job 起不来。sleep 已删,准点性靠这里的 cron。
[triggers]
crons = ["50 23 * * *", "40 0 * * *"]
