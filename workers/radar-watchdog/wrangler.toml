# Cloudflare Worker:日报流水线的外部触发器 + 哨兵。
#
# 为什么不放在 GitHub 自己的 cron 里:GitHub Actions 的 schedule 触发时刻不受控。
# 本仓库实测 2026-08-27 三道 cron 全部漂到 4~5 小时之后,08-28 一道都没触发,
# 连着两天日报靠人工补跑。workflow_dispatch 是即时的,所以起跑的决定权放到外面。
#
# 也不放在本机 launchd 里:那条通道依赖 Mac 开机,出差/关机就断。

name = "ai-daily-radar-watchdog"
main = "src/index.js"
compatibility_date = "2026-08-01"

# 日志留存,出问题能在 CF 控制台回看(也可以 npx wrangler tail 实时看)
[observability]
enabled = true

[vars]
REPO = "nengzong/ai-daily-radar"
# 生成和投递是两条独立的流水线。拆开的理由见 daily-deliver.yml 顶部。
WORKFLOW_GENERATE = "daily-radar.yml"
WORKFLOW_DELIVER = "daily-deliver.yml"

# Cloudflare 的 cron 用 UTC。北京时间 = UTC + 8。
#   50 23 * * *  = 北京 07:50  起跑生成
#   30 0  * * *  = 北京 08:30  准点投递  ← 这一道决定日报几点进群
#   40 0  * * *  = 北京 08:40  哨兵一:没送达就补救
#   10 1  * * *  = 北京 09:10  哨兵二:最后一次补救,给「08:40 才补跑生成」留出完成时间
#
# 【送达时间 = 08:30 这道 cron,和生成耗时无关】
# 早先起跑和投递是同一条流水线,送达时刻 = 起跑时刻 + 生成耗时:
#   - 2026-08-30 之前靠 workflow 里一步 sleep 挂到 08:30 才投递,那 2.5 小时挂机
#     按 GitHub Actions 的 runner 分钟计费,一个月 4500 分钟,把私有仓库 2000 分钟/月
#     的免费额度烧穿,连着几天 job 起不来;
#   - 2026-08-31 删掉 sleep 之后,送达时刻变成 07:50 + 生成耗时,实测每天 08:02~08:03
#     就发出去了,比约定的 08:30 早半小时。
# 现在投递单独成一条只跑几十秒的流水线,由下面这道 08:30 的 cron 打进去,
# 两个毛病都没有了。要改送达时间,改这一行(以及 index.js 顶部的 CRON_DELIVER 常量)。
#
# 【这四道 cron 不是唯一通道,也不该是】2026-09-09 栽过一次:触发器在 API 里查得到、
# 脚本和密钥都完好、账号也没超额,但 Cloudflare 的调度器从 09-08T10:00Z 之后
# 就再没调起过这个 Worker——调用数 0、错误数 0,四道 cron 一道都没发车,
# 当天日报靠人工补跑。最阴的地方是告警本身也挂在这个 Worker 上,
# 调度器一哑,哨兵和告警跟着一起哑,外面完全看不出来。
# 所以现在还有一条不依赖 Cloudflare 调度器的外部通道按点打 /run/*,
# 见 docs/external-cron-backstop.md。改这里的时间,那边也要跟着改。
[triggers]
crons = ["50 23 * * *", "30 0 * * *", "40 0 * * *", "10 1 * * *"]
