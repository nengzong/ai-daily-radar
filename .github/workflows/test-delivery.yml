name: 投递链路自检

# 常驻诊断工具:在真实 Linux runner 上验证钉钉推送和邮件发送两条链路,
# 不调用 Claude,不消耗订阅额度,一次约 30 秒。
#
# 什么时候跑:换了钉钉机器人/webhook、改了 Gmail 应用专用密码、
# 改动了 scripts/ 下的投递脚本,或日报没收到但想先排除投递环节的问题时。
# 在 Actions 页面选本 workflow → Run workflow 手动触发。

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v4

      - name: 造测试用日报
        run: |
          set -euo pipefail
          mkdir -p /tmp/fixture
          cat > /tmp/fixture/brief.md <<'EOF'
          ## 📡 投递链路自检

          > 这是 GitHub Actions 在 Linux runner 上发出的自检消息,不是真实日报。

          ### 🎯 验证项
          - **钉钉加签推送** — 在 runner 上跑通
          - **中文与链接渲染** — [仓库](https://github.com/nengzong/ai-daily-radar)

          > 收到本条说明钉钉通道在云端可用。
          EOF
          cat > /tmp/fixture/full.md <<'EOF'
          # 投递链路自检

          这是 GitHub Actions 在 Linux runner 上发出的自检邮件,不是真实日报。

          重点验证 `base64` 折行在 GNU coreutils 上的行为(BSD 用 -b,GNU 用 -w,
          脚本已改为 `base64 | tr -d '\n' | fold -w 76` 的跨平台写法)。

          - **中文编码**正常
          - [链接](https://github.com/nengzong/ai-daily-radar)可点击
          EOF
          echo "fixture ok"

      - name: 测 Gemini API Key 有效性
        if: always()
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -uo pipefail
          printf 'secret 长度: %s\n' "${#KEY}"
          printf 'secret 是否含空白字符: '
          case "$KEY" in *[[:space:]]*) echo "是(异常)";; *) echo "否";; esac
          code=$(curl -s -o /tmp/gemini.json -w '%{http_code}' \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$KEY" \
            -H "content-type: application/json" \
            -d '{"contents":[{"parts":[{"text":"hi"}]}]}')
          echo "Gemini API HTTP=$code"
          [ "$code" = "200" ] || { echo "响应体:"; cat /tmp/gemini.json; }

      - name: 测钉钉
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python3 scripts/send_dingtalk.py "投递自检" /tmp/fixture/brief.md

      - name: 测邮件
        if: always()
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: bash scripts/send_email.sh "投递链路自检｜来自 GitHub Actions" /tmp/fixture/full.md
