name: AI Daily Radar 生成

# 生成【只做生成】:抓源、写 reports/YYYY-MM-DD.md 和 .dingtalk.md、提交存档。
# 一条消息都不往外发——推钉钉和发邮件在 .github/workflows/daily-deliver.yml 里,
# 由 Worker 在北京 08:30 单独触发。
#
# 为什么拆开:准点送达只能靠「按点触发投递」。合在一起的话送达时刻 = 起跑时刻 + 生成耗时,
# 生成快慢直接把送达时间带跑(2026-09-01~06 实测生成 8~13 分钟,日报 08:02~08:03 就发出去了,
# 比约定的 08:30 早半小时);而想钉死 08:30 就只能在 runner 上 sleep 等点,那正是
# 2026-08-30 烧穿 Actions 月度额度的原因。拆开之后两边都不用将就:
# 生成想跑多久跑多久,投递永远 08:30 整点。

on:
  schedule:
    # 起跑的决定权在仓库外面的 Cloudflare Worker 手上(workers/radar-watchdog/),
    # 它北京 07:50 起跑生成、08:30 触发投递、08:40 和 09:10 两道哨兵查岗补救。
    # dispatch 是即时的,而 GitHub 的 schedule 触发时刻不受控
    # (实测漂过 4~5 小时,也整天不触发过)。
    #
    # 这里只留一道 cron 做末端兜底:Cloudflare 那条通道整个挂掉时,GitHub 自己还能跑。
    # 正常日子里 08:03 前后日报已经生成完,这道 cron 会在「判断今天是否已生成」处秒退。
    #
    #   0 1 * * * = 北京 09:00
    #
    # 【不要再加 cron,也不要把它往早挪】曾经排三道 cron + 在 runner 上 sleep 等到 08:30
    # 才投递,单次 run 挂机 2.5 小时。GitHub Actions 按 runner 分钟计费(私有仓库免费额度
    # 2000 分钟/月),这么跑一个月要 4500 分钟,2026-08-30 额度耗尽,连续几天日报全部
    # 「job was not started」。准点性现在由投递流水线 + Worker 的 08:30 cron 负责,
    # 不要再用 runner 的挂机时间去买。
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    # 生成日报实测 8~13 分钟(2026-09-01~06),提交是秒级的。留足余量即可。
    # 这个上限就是单次跑飞时的计费封顶,别再往大调——200 分钟那版把月额度烧穿过。
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      GEMINI_CLI_TRUST_WORKSPACE: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: 确定日期
        id: date
        run: |
          echo "today=$(date +%F)" >> "$GITHUB_OUTPUT"
          echo "GEMINI_CLI_TRUST_WORKSPACE=true" >> "$GITHUB_ENV"

      - name: 判断今天是否已生成
        id: guard
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          today="${{ steps.date.outputs.today }}"
          # 兜底逻辑:定时触发时,若今天的日报已经出过了就直接跳过,避免多道 cron 重复推送。
          # 手动触发不受此限制,方便随时补跑。
          #
          # 查的是【远端 main 的最新状态】,不是 checkout 出来的工作区。因为 GitHub 的
          # cron 延迟可达 2 小时以上,几道 cron 会挤在一起触发;后触发的那次 checkout 的是
          # 它自己触发那一刻的 SHA,里面看不到前一次刚推上去的日报,查工作区就会漏判成
          # 「今天还没出」从而重复推送。concurrency 保证同一时刻只有一个 job 在跑,
          # 所以在这里查远端拿到的是前一次的最终结果。
          git fetch --quiet --depth=1 origin main
          size=$(git cat-file -s "FETCH_HEAD:reports/$today.md" 2>/dev/null || echo 0)
          if [ "$EVENT" = "schedule" ] && [ "$size" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "远端已有 reports/$today.md($size 字节),今天已出过日报,本次跳过"
            exit 0
          fi

          # 今天生成已经失败过一次(那一道已经告过警):不再自动重试。
          # 重试多半也是同一个错误,只会再烧一次 runner 分钟、再触发一封 GitHub
          # 的「Run failed」邮件。手动 workflow_dispatch 不受此限制,方便修完之后补跑。
          # 这个机制和 daily-deliver.yml 的 state/delivery-failed 是一样的。
          failed=$(git cat-file -s "FETCH_HEAD:state/generate-failed/$today.txt" 2>/dev/null || echo 0)
          if [ "$EVENT" != "workflow_dispatch" ] && [ "$failed" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "state/generate-failed/$today.txt 已存在,今天生成已失败过并已告警,不再自动重试"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: 生成日报
        if: steps.guard.outputs.skip != 'true'
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: 'gemini-3.1-pro-preview'
          gemini_debug: true
          prompt: |
            读取仓库根目录下的 prompts/daily-radar.md,严格按其中的步骤执行今天的日报生成任务。
            该文件是唯一的任务说明,不要脱离它自行发挥。今天的日期以 `date +%F` 的输出为准。
            只需把文件写到工作区,不要执行任何 git 操作(不要 commit、不要建分支、不要 push),
            提交由后续的 workflow 步骤负责。

            这是无头环境,结束回合就等于进程退出。不要启动后台/异步代理,
            也不要为了等待任何东西而结束回合——必须一口气把两个日报文件写完再结束。

      # 两个文件都在且非空,才允许提交存档。空文件被提交上去的后果是:
      # 08:30 的投递流水线看到「日报已生成」,把一份空日报推进公司群。
      - name: 校验日报已生成
        id: verify
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          today="${{ steps.date.outputs.today }}"
          for f in "reports/$today.md" "reports/$today.dingtalk.md"; do
            if [ ! -s "$f" ]; then
              echo "::error::$f 不存在或为空,日报生成失败"
              exit 1
            fi
          done

      # 这一步的 push 就是「今天的日报已就绪」的信号:08:30 的投递流水线和 Worker
      # 哨兵都靠远端 main 上有没有 reports/<今天>.md 来判断,所以它必须真的推上去。
      - name: 提交日报存档
        if: always() && steps.verify.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f "state/generate-failed/${{ steps.date.outputs.today }}.txt" || true
          git add reports/ state/
          if git diff --staged --quiet; then
            echo "无变更,跳过提交"
          else
            git commit -m "日报 ${{ steps.date.outputs.today }}"
            # checkout 出来的是本次触发那一刻的 SHA。cron 被延迟时,远端 main 可能已经
            # 前进(你自己推了提交,或前一次运行推了日报),直接 push 会因非快进被拒。
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      # 生成失败了就立刻记一笔,排在告警前面:这份记录一落盘,后面的 Worker 哨兵补跑、
      # GitHub 兜底 cron 都不会再自动重试(见上面「判断今天是否已生成」)。
      # 不重试的理由:重试多半也是同一个错误,只会再烧一次 runner 分钟(实测 8~13 分钟)、
      # 再触发一封 GitHub 的「Run failed」邮件。2026-10 之前没有这道闸,一天能收到
      # 三四封「Run failed: AI Daily Radar 生成」,和钉钉重复告警一样烦。
      # 手动 workflow_dispatch 不受限制,修完之后可以手动补跑。
      - name: 记录生成失败
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          today="${{ steps.date.outputs.today }}"
          mkdir -p state/generate-failed
          cat > "state/generate-failed/$today.txt" <<EOF
          failed_at=$(date '+%F %T %Z')
          event=${{ github.event_name }}
          run=$RUN_URL
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/generate-failed
          git commit -m "生成失败记录 $today"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # 生成失败时主动告警。以前失败是静默的,只能靠「今天没收到日报」事后察觉,
      # 而那时候你多半已经手动跑过一遍了。
      # 注意这条只说明【没生成出来】;生成好了却没进群是投递流水线的告警。
      # 走 scripts/send_alert.sh:钉钉失败改发邮件,每天最多一条(哨兵补跑再失败也不会再告警)。
      - name: 失败告警
        if: failure()
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TODAY: ${{ steps.date.outputs.today }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > "$RUNNER_TEMP/alert.md" <<EOF
          ## ⚠️ AI 日报生成失败

          - 日期:$TODAY
          - 触发方式:$EVENT
          - [查看运行日志]($RUN_URL)

          今天的日报没生成出来,08:30 也就无从投递。
          今天不会再自动重试,也不会再重复告警。
          去 Actions → AI Daily Radar 生成 → Run workflow 手动补跑,生成好之后再 Run 一次投递。
          EOF
          bash scripts/send_alert.sh "$TODAY" "⚠️ AI 日报失败 $TODAY" "$RUNNER_TEMP/alert.md"

      # 只在出问题时留现场。日报没生成时,这里能直接看出是文件没写、
      # 写错了地方,还是 Claude 压根没干活。
      - name: 失败时导出现场
        if: failure()
        run: |
          echo "--- pwd ---"; pwd
          echo "--- reports/ ---"; ls -la reports/ || echo "reports/ 不存在"
          echo "--- 近 30 分钟内改动过的 md ---"
          find . -name '*.md' -newermt '-30 minutes' -not -path './.git/*' 2>/dev/null | head -20
          echo "--- git status ---"; git status --short | head -20
