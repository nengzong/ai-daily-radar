name: AI Daily Radar

on:
  schedule:
    # 目标:日报在北京 08:30 前后送达。任务本身跑约 15 分钟。
    #
    # GitHub 的定时任务在高负载期会被延迟甚至【直接丢弃】,而午夜 UTC
    # (= 北京 08:00 前后)正是全球 cron 最拥堵的时段。所以这里用两道 cron:
    #
    # 主:23:55 UTC = 北京 07:55 起跑 → 正常情况下 08:15-08:25 送达。
    #    刻意压在午夜 UTC 之前,躲开那个高峰窗口。
    # 备:00:45 UTC = 北京 08:45 起跑 → 仅当主触发被丢弃、今天还没出日报时才真正执行,
    #    否则秒退。见下面的「判断今天是否已生成」步骤。
    - cron: "55 23 * * *"
    - cron: "45 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v4

      - name: 确定日期
        id: date
        run: echo "today=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: 判断今天是否已生成
        id: guard
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          today="${{ steps.date.outputs.today }}"
          # 备用 cron 的兜底逻辑:定时触发时,若今天的日报已在仓库里,直接跳过,
          # 避免主/备两次触发都成功时重复推送。手动触发不受此限制,方便随时补跑。
          if [ "$EVENT" = "schedule" ] && [ -s "reports/$today.md" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reports/$today.md 已存在,今天已出过日报,本次跳过"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成日报
        if: steps.guard.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 不传这个的话,action 会尝试用 OIDC 换 Claude GitHub App 的 token,
          # 既需要 id-token: write 权限,又要求该 App 已安装到本仓库。
          # 我们只需要在工作区读写文件,没有 PR 交互,直接用 workflow 自带 token 即可。
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: |
            读取仓库根目录下的 prompts/daily-radar.md,严格按其中的步骤执行今天的日报生成任务。
            该文件是唯一的任务说明,不要脱离它自行发挥。今天的日期以 `date +%F` 的输出为准。
            只需把文件写到工作区,不要执行任何 git 操作(不要 commit、不要建分支、不要 push),
            提交由后续的 workflow 步骤负责。

            这是无头环境,结束回合就等于进程退出。不要启动后台/异步代理,
            也不要为了等待任何东西而结束回合——必须一口气把两个日报文件写完再结束。
          claude_args: |
            --max-turns 120
            --allowedTools Read,Write,Edit,Bash,WebFetch,WebSearch

      - name: 排查用:列出工作区产物
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          echo "--- pwd ---"; pwd
          echo "--- reports/ ---"; ls -la reports/ || echo "reports/ 不存在"
          echo "--- 全仓库最近修改的 md(排除 .git) ---"
          find . -name '*.md' -newermt '-30 minutes' -not -path './.git/*' 2>/dev/null | head -20
          echo "--- git status ---"; git status --short | head -20

      - name: 校验日报已生成
        id: verify
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          full="reports/${{ steps.date.outputs.today }}.md"
          brief="reports/${{ steps.date.outputs.today }}.dingtalk.md"
          for f in "$full" "$brief"; do
            if [ ! -s "$f" ]; then
              echo "::error::$f 不存在或为空,日报生成失败,中止投递"
              exit 1
            fi
          done
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "brief=$brief" >> "$GITHUB_OUTPUT"
          # grep -c 无匹配时会打印 0 并以 1 退出,用 || true 吞掉退出码
          # (写成 || echo 0 会输出两行,污染 GITHUB_OUTPUT)
          echo "count=$(grep -c '^### ' "$full" || true)" >> "$GITHUB_OUTPUT"

      - name: 推送钉钉
        if: steps.guard.outputs.skip != 'true'
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          python3 scripts/send_dingtalk.py \
            "AI 日报 ${{ steps.date.outputs.today }}" \
            "${{ steps.verify.outputs.brief }}"

      - name: 发送邮件
        if: always() && steps.verify.outcome == 'success'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          bash scripts/send_email.sh \
            "AI 日报 ${{ steps.date.outputs.today }}｜${{ steps.verify.outputs.count }} 条精选" \
            "${{ steps.verify.outputs.full }}"

      - name: 提交日报存档
        if: always() && steps.verify.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "无变更,跳过提交"
          else
            git commit -m "日报 ${{ steps.date.outputs.today }}"
            git push
          fi
