name: AI Daily Radar

on:
  schedule:
    # 起跑的决定权在仓库外面的 Cloudflare Worker 手上(workers/radar-watchdog/),
    # 它北京 07:50 用 workflow_dispatch 起跑,08:40 查岗补跑。dispatch 是即时的,
    # 而 GitHub 的 schedule 触发时刻不受控(实测漂过 4~5 小时,也整天不触发过)。
    #
    # 这里只留一道 cron 做末端兜底:Cloudflare 那条通道整个挂掉时,GitHub 自己还能跑。
    # 正常日子里日报 08:15 前后已经送达,这道 cron 会在「判断今天是否已生成」处秒退。
    #
    #   0 1 * * * = 北京 09:00
    #
    # 【不要再加 cron,也不要把它往早挪】曾经排三道 cron + 在 runner 上 sleep 等到 08:30
    # 才投递,单次 run 挂机 2.5 小时。GitHub Actions 按 runner 分钟计费(私有仓库免费额度
    # 2000 分钟/月),这么跑一个月要 4500 分钟,2026-08-30 额度耗尽,连续几天日报全部
    # 「job was not started」。准点性现在由 Worker 负责,不要再用 runner 的挂机时间去买。
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    # 生成日报实测 15~25 分钟,投递和提交是秒级的。留一倍余量即可。
    # 这个上限就是单次跑飞时的计费封顶,别再往大调——200 分钟那版把月额度烧穿过。
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v4

      - name: 确定日期
        id: date
        run: echo "today=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: 判断今天是否已生成
        id: guard
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          today="${{ steps.date.outputs.today }}"
          # 兜底逻辑:定时触发时,若今天的日报已经出过了就直接跳过,避免多道 cron 重复推送。
          # 手动触发不受此限制,方便随时补跑。
          #
          # 查的是【远端 main 的最新状态】,不是 checkout 出来的工作区。因为 GitHub 的
          # cron 延迟可达 2 小时以上,几道 cron 会挤在一起触发;后触发的那次 checkout 的是
          # 它自己触发那一刻的 SHA,里面看不到前一次刚推上去的日报,查工作区就会漏判成
          # 「今天还没出」从而重复推送。concurrency 保证同一时刻只有一个 job 在跑,
          # 所以在这里查远端拿到的是前一次的最终结果。
          git fetch --quiet --depth=1 origin main
          size=$(git cat-file -s "FETCH_HEAD:reports/$today.md" 2>/dev/null || echo 0)
          if [ "$EVENT" = "schedule" ] && [ "$size" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "远端已有 reports/$today.md($size 字节),今天已出过日报,本次跳过"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成日报
        if: steps.guard.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 不传这个的话,action 会尝试用 OIDC 换 Claude GitHub App 的 token,
          # 既需要 id-token: write 权限,又要求该 App 已安装到本仓库。
          # 我们只需要在工作区读写文件,没有 PR 交互,直接用 workflow 自带 token 即可。
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            读取仓库根目录下的 prompts/daily-radar.md,严格按其中的步骤执行今天的日报生成任务。
            该文件是唯一的任务说明,不要脱离它自行发挥。今天的日期以 `date +%F` 的输出为准。
            只需把文件写到工作区,不要执行任何 git 操作(不要 commit、不要建分支、不要 push),
            提交由后续的 workflow 步骤负责。

            这是无头环境,结束回合就等于进程退出。不要启动后台/异步代理,
            也不要为了等待任何东西而结束回合——必须一口气把两个日报文件写完再结束。
          claude_args: |
            --max-turns 120
            --allowedTools Read,Write,Edit,Bash,WebFetch,WebSearch

      - name: 校验日报已生成
        id: verify
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          full="reports/${{ steps.date.outputs.today }}.md"
          brief="reports/${{ steps.date.outputs.today }}.dingtalk.md"
          for f in "$full" "$brief"; do
            if [ ! -s "$f" ]; then
              echo "::error::$f 不存在或为空,日报生成失败,中止投递"
              exit 1
            fi
          done
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "brief=$brief" >> "$GITHUB_OUTPUT"
          # grep -c 无匹配时会打印 0 并以 1 退出,用 || true 吞掉退出码
          # (写成 || echo 0 会输出两行,污染 GITHUB_OUTPUT)
          echo "count=$(grep -c '^### ' "$full" || true)" >> "$GITHUB_OUTPUT"

      - name: 推送钉钉
        if: steps.guard.outputs.skip != 'true'
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          python3 scripts/send_dingtalk.py \
            "AI 日报 ${{ steps.date.outputs.today }}" \
            "${{ steps.verify.outputs.brief }}"

      - name: 发送邮件
        if: always() && steps.verify.outcome == 'success'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          bash scripts/send_email.sh \
            "AI 日报 ${{ steps.date.outputs.today }}｜${{ steps.verify.outputs.count }} 条精选" \
            "${{ steps.verify.outputs.full }}"

      - name: 提交日报存档
        if: always() && steps.verify.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "无变更,跳过提交"
          else
            git commit -m "日报 ${{ steps.date.outputs.today }}"
            # checkout 出来的是本次触发那一刻的 SHA。cron 被延迟时,远端 main 可能已经
            # 前进(你自己推了提交,或前一次运行推了日报),直接 push 会因非快进被拒。
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      # 定时运行失败时主动告警。以前失败是静默的,只能靠「今天没收到日报」
      # 事后察觉,而那时候你多半已经手动跑过一遍了。
      - name: 失败告警
        if: failure()
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          TODAY: ${{ steps.date.outputs.today }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > "$RUNNER_TEMP/alert.md" <<EOF
          ## ⚠️ AI 日报生成失败

          - 日期:$TODAY
          - 触发方式:$EVENT
          - [查看运行日志]($RUN_URL)

          今天的日报没有送达。去 Actions 页面手动 Run workflow 可以补跑。
          EOF
          python3 scripts/send_dingtalk.py "⚠️ AI 日报失败 $TODAY" "$RUNNER_TEMP/alert.md"

      # 只在出问题时留现场。日报没生成时,这里能直接看出是文件没写、
      # 写错了地方,还是 Claude 压根没干活。
      - name: 失败时导出现场
        if: failure()
        run: |
          echo "--- pwd ---"; pwd
          echo "--- reports/ ---"; ls -la reports/ || echo "reports/ 不存在"
          echo "--- 近 30 分钟内改动过的 md ---"
          find . -name '*.md' -newermt '-30 minutes' -not -path './.git/*' 2>/dev/null | head -20
          echo "--- git status ---"; git status --short | head -20
